<!--Este archivo esta escrito en HTML-->
<!DOCTYPE html>
<!--Idioma de la pagina (español)-->
<html lang="es">
<!--Encabezado-->
<head>
    <!--Configuracion de caracteres como la ñ, acentos, tec-->
    <meta charset="UTF-8">
    <!--Pagina sea responsive(adapta la pagina al tamaño del dispositivo)-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Nombre de la pestaña del navegador-->
    <title>CRM Ventas</title>
    <!--Bootstrap (libreria CSS)-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Conectado al CSS-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!--Cuerpo de la pagina, lo visible-->
<!--Crea un contenedor flexbox (caja flexible) -->
<div class="d-flex">
    <!--Sidebar/Menu lateral-->
    <!--text-white hace que el texto sea blanco-->
    <!--p-3 agrega un espacio interioir(p de padding y 3 tamaño mediano)-->
    <!--div es un contenedor para organizar elementos-->
    <div class="sidebar text-white p-3">
        <!--Parte superior del menu-->
        <div>
            <!--Titulo principal-->
            <!--mb-4 es m de margen, b de boton y 4 de tamaño, por ende agrega espacio debajo del titulo-->
            <h1 class="mb-4">
                CRM Dashboard 
            </h1>
            <!--Lista del menu lateral(opciones)-->
            <!--ul es unordered list (lista no ordenada)-->
            <ul class="nav flex-column">
                <!--Item dashboard-->
                <!--nav es un bootstrap que transforma la lista en navegacion-->
                <li class="nav-item">
                    <!--Link-->
                    <!--a es un enlace y hfref define a donde va-->
                    <a href="dashboard.html" class="nav-link text-white">
                        Dashboard
                    </a>
                </li>
                <!--Item clientes-->
                <li class="nav-item">
                    <!--Link-->
                    <a href="clientes.html" class="nav-link text-white">
                        Clientes
                    </a>
                </li>
                <!--Item productos-->
                <li class="nav-item">
                    <!--Link-->
                    <a href="productos.html" class="nav-link text-white">
                        Productos
                    </a>
                </li>
                <!--Item ventas-->
                <li class="nav-item">
                    <!--Link-->
                    <a href="ventas.html" class="nav-link text-white">
                        Ventas
                    </a>
                </li>
            </ul>
        </div>
        <!--Logo de la funeraria, debajo del menu lateral-->
        <!--src indica el archivo de imagen-->
        <!--alt es por si la imagen falla aparece este texto-->
        <img src="logo.jpeg" alt="Logo CRM" class="logo">
    </div>
    <!--Contenido principal-->
    <!--container-fluid es clase bootstrap y hace que el contendor ocupe todo el ancho disponible-->
    <!--p-4 es el padding interno (espacio aldededor del contenido)-->
    <div class="container-fluid p-4">
        <!--Titulo secundario-->
        <!--mb-4 es el margen, espacio debajo-->
        <h2 class="mb-4">
            Dashboard CRM
        </h2>
        <!--Fila de tarjetas-->
        <div class="row">
            <!--Tarjeta clientes-->
            <!--col-md-4 es la division en 12/4 por ende son 3 tarjetas-->
            <div class="col-md-4">
                <!--Cracion de la tarjeta clientes-->
                <!--shadow agerga sombra-->
                <div class="card clientes-card shadow p-3">
                    <!--Titulo mas pequeño, es de la tarjeta-->
                    <h5>
                        Total de Clientes
                    </h5>
                    <h1>
                        24
                    </h1>
                </div>
            </div>
            <!--Tarjeta productos-->
            <div class="col-md-4">
                <div class="card productos-card shadow p-3">
                    <h5>
                        Variedad de Productos
                    </h5>
                    <h1>
                        12
                    </h1>
                </div>
            </div>
            <!--Tarjeta ventas-->
            <div class="col-md-4">
                <div class="card ventas-card shadow p-3">
                    <h5>
                        Ventas Realizadas
                    </h5>
                    <h1>
                        7
                    </h1>
                </div>
            </div>
        </div>
        <!--Tarjeta que tiene la tabla grande-->
        <div class="card tabla-card shadow mt-5">
            <!--Titulo de la tabla-->
            <div class="tabla-header">
                <h3 class="mb-3">
                Últimas ventas
            </h3>
            </div>
            <!--Crea una tabla-->
            <table class="table">
                <!--Encabezado de la tabla-->
                <thead class="encabezado-tabla">
                    <!--Fila del encabezado (columnas)-->
                    <tr>
                        <!--Columna 1-->
                        <th>
                            Cliente
                        </th>
                        <!--Columna 2-->
                        <th>
                            Producto
                        </th>
                        <!--Columna 3-->
                        <th>
                            Precio
                        </th>
                    </tr>
                </thead>
                <!--Cuerpo de la tabla-->
                <tbody>
                    <!--Fila 1-->
                    <tr>
                        <!--Dato 1-->
                        <td>
                            Juan Pérez
                        </td>

                        <!--Dato 2-->
                        <td>
                            Urna Premium
                        </td>
                        <!--Dato 3-->
                        <td>
                            $1.200.000
                        </td>
                    </tr>
                    <!--Fila 2-->
                    <tr>
                        <!--Dato 1-->
                        <td>
                            María Soto
                        </td>
                        <!--Dato 2-->
                        <td>
                            Servicio Funeral
                        </td>
                        <!--Dato 3-->
                        <td>
                            $850.000
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
