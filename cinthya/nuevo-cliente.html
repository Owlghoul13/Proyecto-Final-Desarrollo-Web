<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuevo Cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar text-white p-3">

        <div>
            <h1 class="mb-4">CRM Clientes</h1>

            <div class="nav flex-column">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="clientes.html" class="nav-link">Clientes</a>
                <a href="productos.html" class="nav-link">Productos</a>
                <a href="ventas.html" class="nav-link">Ventas</a>
            </div>
        </div>

        <div class="mt-auto text-center">
            <button onclick="cerrarSesion()" class="btn btn-danger w-100 fw-bold mb-3">
                Cerrar Sesión
            </button>

            <img src="logo.jpeg" alt="Logo CRM" class="logo">
        </div>

    </div>

    <!-- Contenido -->
    <div class="container-fluid p-4">

        <h2 class="mb-4 fw-bold">Nuevo Cliente</h2>

        <!-- DATOS PERSONALES -->
        <div class="card shadow mb-4">

            <div class="card-header header-verde text-white">
                <h5 class="mb-0">Datos Personales</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Nombres</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Apellido Paterno</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Apellido Materno</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">RUT</label>
                        <input type="text" class="form-control" placeholder="12.345.678-9">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha de Nacimiento</label>
                        <input type="date" class="form-control">
                    </div>

                </div>

            </div>

        </div>

        <!-- DATOS DE CONTACTO -->
        <div class="card shadow mb-4">

            <div class="card-header header-verde text-white">
                <h5 class="mb-0">Datos de Contacto</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control">
                    </div>

                </div>

            </div>

        </div>

        <!-- DOMICILIO -->
        <div class="card shadow mb-4">

            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Domicilio</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Región</label>
                        <select class="form-select">
                            <option selected>Seleccione Región</option>
                            <option>Región Metropolitana</option>
                            <option>Valparaíso</option>
                            <option>Biobío</option>
                            <option>O'Higgins</option>
                            <option>Maule</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Comuna</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" class="form-control">
                    </div>

                </div>

            </div>

        </div>

        <!-- ESTADO DEL CLIENTE -->
        <div class="card shadow mb-4">

            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Estado del Cliente</h5>
            </div>

            <div class="card-body">

                <select class="form-select">
                    <option selected>Activo</option>
                    <option>Inactivo</option>
                </select>

            </div>

        </div>

        <!-- BOTONES -->
        <div class="text-end mb-5">

            <button class="btn btn-success btn-lg">
                Guardar Cliente
            </button>

            <a href="clientes.html" class="btn btn-secondary btn-lg">
                Cancelar
            </a>

        </div>

    </div>

</div>

<script src="../felipe/auth.js"></script>

</body>
</html>


<!--Modal-->
<div class="modal fade" id="modalNuevoItem" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header encabezado-modal">
                <h2 class="modal-title text-white">
                    <i class="bi bi-box-seam-fill"></i> Nuevo Producto o Servicio
                </h2>
                
                <button type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close">
            </button>
        </div>
            
            <div class="modal-body px-4 pt-2 pb-4">
                <h6 class="text-secondary border-bottom pb-2 mb-4">Formulario de Registro</h6>
                
                <form id="formProducto">
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary" style="font-size: 0.9rem;">Nombre del Producto/Servicio:</label>
                        <input type="text" class="form-control" id="inputNombreProd" placeholder="Ej: Plan Funerario Básico">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary" style="font-size: 0.9rem;">Categoría:</label>
                        <select class="form-select" id="inputCategoria">
                            <option selected value="">-- Seleccione una opción --</option>
                            <option value="Producto">Producto</option>
                            <option value="Servicio">Servicio</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary" style="font-size: 0.9rem;">Descripción Corta:</label>
                        <input type="text" class="form-control" id="inputDescCorta" placeholder="Breve resumen del ítem">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary" style="font-size: 0.9rem;">Descripción Larga:</label>
                        <textarea class="form-control" id="inputDescLarga" rows="3" placeholder="Detalles completos del producto o servicio..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary" style="font-size: 0.9rem;">Valor Actual ($ CLP):</label>
                        <input type="number" class="form-control" id="inputPrecioProd" placeholder="Ej: 850000">
                    </div>
                    
                    <button type="button" class="btn w-100 fw-bold text-white py-2" style="background-color: #38761d;" id="btnGuardarProducto">
                        <i class="bi bi-arrow-repeat"></i> Guardar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
