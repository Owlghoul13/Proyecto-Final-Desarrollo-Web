<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Funeraria - Gestión de Catálogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Administración del Catálogo de Productos y Servicios</h2>

        <div class="card-form">
            <h3>Formulario de Registro</h3>
            <form id="product-form">
                <input type="hidden" id="product-id">

                <div class="form-group">
                    <label for="product-name">Nombre del Producto/Servicio:</label>
                    <input type="text" id="product-name" placeholder="Ej. Urna de Roble Imperial">
                </div>

                <div class="form-group">
                    <label for="product-category">Categoría:</label>
                    <select id="product-category">
                        <option value="">-- Seleccione una opción --</option>
                        <option value="Producto">Producto</option>
                        <option value="Servicio">Servicio</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="product-short-desc">Descripción Corta:</label>
                    <input type="text" id="product-short-desc" placeholder="Resumen de una línea para el vendedor">
                </div>

                <div class="form-group">
                    <label for="product-long-desc">Descripción Larga:</label>
                    <textarea id="product-long-desc" rows="3" placeholder="Especificaciones completas, materiales o coberturas..."></textarea>
                </div>

                <div class="form-group">
                    <label for="product-price">Valor Actual ($ CLP):</label>
                    <input type="number" id="product-price" placeholder="Ej. 1200000">
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">Guardar </button>
            </form>
        </div>

        <div class="card-table">
            <h3>Inventario y Oferta Comercial Vigente</h3>
            <table class="table-catalog">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio Actual</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="catalog-table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="../felipe/database.js"></script>
    <script src="../felipe/productos.js"></script>
</body>
</html>
