<!DOCTYPE html>
<html lang="es">
<!--Encabezado-->
<head>
    <!--Configuracion de caracteres como la ñ, acentos, tec-->
    <meta charset="UTF-8">
    <!--Pagina sea responsive(adapta la pagina al tamaño del dispositivo)-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Nombre de la pestaña del navegador-->
    <title>Clientes CRM</title>
    <!--Bootstrap (libreria CSS)-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Conectado al CSS-->
    <link rel="stylesheet" href="style.css">
</head>
<!--Cuerpo de la pagina de clientes-->
<body>
    <div class="d-flex">
        <!--Menu lateral-->
        <div class="sidebar text-white p-3">
            <div>
                <h1 class="mb-4">
                CRM Clientes
                 </h1>
                <!--Lista del menu lateral (opciones)-->
                <div class="nav flex-column">
                    <a href="dashboard.html" class="nav-link">
                        Dashboard
                    </a>
                    <a href="clientes.html" class="nav-link">
                        Clientes
                    </a>
                    <a href="#" class="nav-link">
                        Productos
                    </a>
                    <a href="#" class="nav-link">
                        Ventas
                    </a>
                </div>
            </div>
            <!--Logo de la funeraria, debajo del menu lateral-->
        <img src="logo.jpeg" alt="Logo CRM" class="logo">
        </div>
        <!--================================-->
        <!--Contenido principal-->
        <div class="container-fluid p-4">
            <!--Titulo-->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Gestión de Clientes</h2>
                <button class="btn btn-success btn-lg">
                    + Nuevo Cliente
                </button>
            </div>
            <!--Buscador-->
            <div class="mb-4">
                <input 
                    type="text"
                    class="form-control"
                    placeholder="Buscar cliente..."
                >
            </div>
            <!--Tabla central de lista de clientes-->
            <div class="card tabla-card">
                <!--Encabezado de la lista-->
                <div class="tabla-header">
                    <h3>Lista de Clientes</h3>
                </div>
                <!--Encabezado (Columnas)-->
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="encabezado-tabla">
                            <!--Columnas(tr)-->
                            <tr>
                                <th>Nombre</th>
                                <th>Teléfono</th>
                                <th>Correo</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <!--Datos de la tabla-->
                        <tbody>
                            <!--Filas de los lclientes(tr)-->
                            <tr>
                                <!--Nombre-->
                                <td>Juan Pérez</td>
                                <!--Telefono-->
                                <td>+56 9 1234 5678</td>
                                <!--Correo-->
                                <td>juan@gmail.com</td>
                                <!--Estado del cliente-->
                                <td>
                                    <!--Cajita verde bootstrap-->
                                    <!--Exiten diferentes colores:
                                    bg-:
                                    success -> verde
                                    danger -> rojo
                                    warning -> amarillo
                                    primary -> azul
                                    secondary -> gris 
                                    -->
                                    <span class="badge bg-success">
                                        Activo
                                    </span>
                                </td>
                                <!--Acciones-->
                                <td>
                                    <!--Botones de las acciones-->

                                    <!--Boton del editar-->
                                    <button class="btn btn-warning btn-sm">
                                        Editar
                                    </button>
                                    <!--Boton del eliminar-->
                                    <button class="btn btn-danger btn-sm">
                                        Eliminar
                                    </button>
                                </td>
                            </tr>
                            <!--Cliente 2 (mismo orden anterioir)-->
                            <tr>
                                <td>María Soto</td>
                                <td>+56 9 9876 5432</td>
                                <td>maria@gmail.com</td>
                                <td>
                                    <span class="badge bg-secondary">
                                        Inactivo
                                    </span>
                                </td>
                                <td>
                                    <button class="btn btn-warning btn-sm">
                                        Editar
                                    </button>
                                    <button class="btn btn-danger btn-sm">
                                        Eliminar
                                    </button>
                                </td>
                            </tr>
                            <!--Cliente 3 (mismo orden anterioir)-->
                            <tr>
                                <td>Carlos Reyes</td>
                                <td>+56 9 4455 7788</td>
                                <td>carlos@gmail.com</td>
                                <td>
                                    <span class="badge bg-success">
                                        Activo
                                    </span>
                                </td>
                                <td>
                                    <button class="btn btn-warning btn-sm">
                                        Editar
                                    </button>
                                    <button class="btn btn-danger btn-sm">
                                        Eliminar
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
