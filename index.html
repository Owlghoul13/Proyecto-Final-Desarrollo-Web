<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CRM Funeraria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="cinthya/style.css"> <style>
        /* Estilos rápidos solo para centrar el login de forma elegante */
        body { background-color: #f5f6fa; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-card img { max-width: 150px; margin-bottom: 20px; border-radius: 8px; }
        .btn-login { background-color: #3A7307; color: white; width: 100%; font-weight: bold; padding: 10px; border-radius: 6px; border: none; transition: 0.3s; }
        .btn-login:hover { background-color: #2b5405; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="cinthya/logo.jpeg" alt="Logo CRM">
        <h3 class="mb-4" style="color: #2d3748;">Acceso al Sistema</h3>
        
        <form id="login-form">
            <div class="mb-3 text-start">
                <label for="username" class="form-label fw-bold">Usuario (Rol)</label>
                <select id="username" class="form-select" required>
                    <option value="">Seleccione su perfil...</option>
                    <option value="admin">Administrador General</option>
                    <option value="vendedor">Asesor de Ventas</option>
                </select>
            </div>
            
            <div class="mb-4 text-start">
                <label for="password" class="form-label fw-bold">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="Ingrese cualquier clave" required>
            </div>
            
            <button type="submit" class="btn-login">Ingresar al Dashboard</button>
        </form>
    </div>

    <script src="felipe/auth.js"></script>
</body>
</html>
