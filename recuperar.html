<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Recuperar contraseña</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="cinthya/style.css" />
    <style>
      body {
        background: #f5f6fa;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .login-card {
        background: white;
        width: 420px;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      .login-card img {
        width: 150px;
        height: auto;
        margin-bottom: 20px;
      }

      .form-control {
        height: 55px;
        border-radius: 12px;
      }

      .btn-login {
        background: #4d7c1f;
        color: white;
        border: none;
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        font-weight: bold;
        margin-top: 10px;
      }

      .btn-login:hover {
        background: #3b5f17;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <img
        src="cinthya/logo.jpeg"
        alt="Logo CRM"
        style="
          width: 150px;
          height: auto;
          display: block;
          margin: 0 auto 20px auto;
        "
      />
      <h3 class="mb-4" style="color: #2d3748">Recuperar contraseña</h3>

      <form>
        <div class="mb-3 text-start">
          <label class="form-label fw-bold"> Correo electrónico </label>
          <input
            type="email"
            class="form-control"
            placeholder="Ingrese su correo"
            required
          />
        </div>

        <button
          type="button"
          class="btn-login"
          onclick="
            alert('Se ha enviado un enlace de recuperación a su correo.')
          "
        >
          Enviar enlace de recuperación
        </button>

        <div class="mt-3">
          <a href="index.html"> Volver al login </a>
        </div>
      </form>
    </div>
  </body>
</html>
